<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biel AAC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1A1A1A;
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #2A2A2A;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    max-width: 440px;
    width: 100%;
    overflow: hidden;
    text-align: center;
  }
  .card-header { background: #0A0A0A; padding: 36px 32px; }
  .card-header img { max-width: 180px; width: 100%; height: auto; }
  .card-body { padding: 40px 32px; }
  .check-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: #2E7D32; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .check-icon svg { width: 28px; height: 28px; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
  p { color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.6; margin-bottom: 8px; }
  .hint {
    margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 12px; color: rgba(255,255,255,0.35);
  }
  .btn {
    display: inline-block; width: 100%; margin-top: 20px; padding: 13px 28px;
    background: #CC0000; color: #FFFFFF; text-decoration: none; border: none;
    border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; text-align: center;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .form-row { text-align: left; margin-bottom: 14px; }
  .form-label {
    display: block; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5);
    text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px;
  }
  .form-input {
    width: 100%; background: #1A1A1A; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; padding: 12px 14px; color: #FFFFFF; font-size: 14px; outline: none;
  }
  .form-input:focus { border-color: #CC0000; }
  .error-msg {
    background: #8B0000; border-radius: 8px; padding: 10px 14px;
    font-size: 13px; margin: 0 0 14px; text-align: left;
  }
  .spinner {
    width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff; border-radius: 50%; display: inline-block;
    animation: spin .7s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="card-header"><img src="/logo_branca.png" alt="Biel AAC" /></div>
    <div class="card-body" id="card-body">
      <div style="padding:20px 0;"><span class="spinner" style="width:24px;height:24px;"></span></div>
    </div>
  </div>

<script>
  // ─── TEXTOS POR IDIOMA ──────────────────────────────────────
  const STRINGS = {
    pt: {
      success: {
        signup: { title: 'Conta confirmada!', message: 'Sua conta no Biel AAC foi confirmada com sucesso.' },
        invite: { title: 'Convite aceito!', message: 'Sua conta no Biel AAC está pronta para uso.' },
        email_change: { title: 'Email atualizado!', message: 'Seu email no Biel AAC foi atualizado com sucesso.' },
        default: { title: 'Tudo certo!', message: 'A ação foi concluída com sucesso.' },
      },
      hintDesktop: 'Agora, abra o aplicativo Biel AAC no tablet ou celular onde ele está instalado e faça login normalmente.',
      openApp: 'Abrir o app',
      recoveryTitle: 'Crie uma nova senha',
      recoverySub: 'Escolha uma nova senha para sua conta Biel AAC.',
      newPassword: 'Nova senha',
      confirmPassword: 'Confirmar nova senha',
      savePassword: 'Salvar nova senha',
      saving: 'Salvando...',
      passwordTooShort: 'A senha precisa ter pelo menos 6 caracteres.',
      passwordMismatch: 'As senhas não coincidem.',
      invalidLink: 'Este link é inválido ou expirou. Solicite um novo email.',
      recoverySuccessTitle: 'Senha redefinida!',
      recoverySuccessMessage: 'Sua senha foi alterada com sucesso.',
      genericError: 'Não foi possível concluir a ação. Tente novamente.',
    },
    en: {
      success: {
        signup: { title: 'Account confirmed!', message: 'Your Biel AAC account has been successfully confirmed.' },
        invite: { title: 'Invite accepted!', message: 'Your Biel AAC account is ready to use.' },
        email_change: { title: 'Email updated!', message: 'Your Biel AAC email has been successfully updated.' },
        default: { title: 'All set!', message: 'The action was completed successfully.' },
      },
      hintDesktop: 'Now, open the Biel AAC app on the tablet or phone where it is installed and log in normally.',
      openApp: 'Open the app',
      recoveryTitle: 'Create a new password',
      recoverySub: 'Choose a new password for your Biel AAC account.',
      newPassword: 'New password',
      confirmPassword: 'Confirm new password',
      savePassword: 'Save new password',
      saving: 'Saving...',
      passwordTooShort: 'Password must be at least 6 characters.',
      passwordMismatch: 'Passwords do not match.',
      invalidLink: 'This link is invalid or has expired. Please request a new email.',
      recoverySuccessTitle: 'Password reset!',
      recoverySuccessMessage: 'Your password has been successfully changed.',
      genericError: 'Could not complete the action. Please try again.',
    },
    es: {
      success: {
        signup: { title: '¡Cuenta confirmada!', message: 'Tu cuenta de Biel AAC fue confirmada con éxito.' },
        invite: { title: '¡Invitación aceptada!', message: 'Tu cuenta de Biel AAC está lista para usar.' },
        email_change: { title: '¡Email actualizado!', message: 'Tu email de Biel AAC fue actualizado con éxito.' },
        default: { title: '¡Listo!', message: 'La acción se completó con éxito.' },
      },
      hintDesktop: 'Ahora, abre la aplicación Biel AAC en la tablet o el teléfono donde está instalada e inicia sesión normalmente.',
      openApp: 'Abrir la app',
      recoveryTitle: 'Crea una nueva contraseña',
      recoverySub: 'Elige una nueva contraseña para tu cuenta Biel AAC.',
      newPassword: 'Nueva contraseña',
      confirmPassword: 'Confirmar nueva contraseña',
      savePassword: 'Guardar nueva contraseña',
      saving: 'Guardando...',
      passwordTooShort: 'La contraseña debe tener al menos 6 caracteres.',
      passwordMismatch: 'Las contraseñas no coinciden.',
      invalidLink: 'Este enlace no es válido o expiró. Solicita un nuevo email.',
      recoverySuccessTitle: '¡Contraseña restablecida!',
      recoverySuccessMessage: 'Tu contraseña fue cambiada con éxito.',
      genericError: 'No se pudo completar la acción. Inténtalo de nuevo.',
    },
    fr: {
      success: {
        signup: { title: 'Compte confirmé !', message: 'Votre compte Biel AAC a été confirmé avec succès.' },
        invite: { title: 'Invitation acceptée !', message: 'Votre compte Biel AAC est prêt à être utilisé.' },
        email_change: { title: 'Email mis à jour !', message: 'Votre email Biel AAC a été mis à jour avec succès.' },
        default: { title: "C'est fait !", message: "L'action a été effectuée avec succès." },
      },
      hintDesktop: "Ouvrez maintenant l'application Biel AAC sur la tablette ou le téléphone où elle est installée et connectez-vous normalement.",
      openApp: "Ouvrir l'app",
      recoveryTitle: 'Créez un nouveau mot de passe',
      recoverySub: 'Choisissez un nouveau mot de passe pour votre compte Biel AAC.',
      newPassword: 'Nouveau mot de passe',
      confirmPassword: 'Confirmer le nouveau mot de passe',
      savePassword: 'Enregistrer le nouveau mot de passe',
      saving: 'Enregistrement...',
      passwordTooShort: 'Le mot de passe doit contenir au moins 6 caractères.',
      passwordMismatch: 'Les mots de passe ne correspondent pas.',
      invalidLink: 'Ce lien est invalide ou a expiré. Veuillez demander un nouvel email.',
      recoverySuccessTitle: 'Mot de passe réinitialisé !',
      recoverySuccessMessage: 'Votre mot de passe a été modifié avec succès.',
      genericError: "Impossible de terminer l'action. Réessayez.",
    },
  };

  function detectLang() {
    // Prioridade 1: idioma explícito na URL (?lang=en), passado pelo app no
    // momento do cadastro/reset — reflete o idioma que a pessoa realmente
    // estava usando, não o idioma configurado no navegador/SO.
    const fromQuery = new URLSearchParams(window.location.search || '').get('lang');
    if (fromQuery && STRINGS[fromQuery]) return fromQuery;

    // Prioridade 2 (fallback): idioma do navegador, para links antigos ou
    // fluxos que ainda não passam ?lang= (convite, troca de email).
    const nav = (navigator.language || 'pt').toLowerCase();
    if (nav.startsWith('pt')) return 'pt';
    if (nav.startsWith('es')) return 'es';
    if (nav.startsWith('fr')) return 'fr';
    return 'en';
  }

  // Leitura best-effort do "type" (signup/invite/email_change/recovery), só
  // para escolher o TEXTO certo — a decisão real de "é reset de senha?" vem
  // do evento PASSWORD_RECOVERY abaixo, não deste parâmetro.
  function detectFlowTypeHint() {
    const fromHash = new URLSearchParams((window.location.hash || '').replace(/^#/, '')).get('type');
    const fromQuery = new URLSearchParams(window.location.search || '').get('type');
    return fromHash || fromQuery || 'default';
  }

  const SUPABASE_URL = 'https://bhlibvcmmarljcbbpzbc.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJobGlidmNtbWFybGpjYmJwemJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2MTA3MDQsImV4cCI6MjA5ODE4NjcwNH0.TJY1jR1QBzhb1_dbZafoZxEfkltSjIq4jchXFZqChYw';
  // O app Flutter usa AuthFlowType.implicit — os links de email trazem os
  // tokens prontos no fragmento da URL (#access_token=...), sem depender de
  // nenhum segredo local. detectSessionInUrl faz esse reconhecimento sozinho.
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { detectSessionInUrl: true, flowType: 'implicit' },
  });

  const lang = detectLang();
  const t = STRINGS[lang];
  document.documentElement.lang = lang;

  const body = document.getElementById('card-body');
  let resolved = false;

  function checkIconHtml() {
    return '<div class="check-icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M20 6L9 17L4 12" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
  }

  function renderRecoveryForm() {
    resolved = true;
    body.innerHTML =
      '<h1>' + t.recoveryTitle + '</h1>' +
      '<p style="margin-bottom:24px;">' + t.recoverySub + '</p>' +
      '<div id="recovery-error"></div>' +
      '<div class="form-row">' +
        '<label class="form-label">' + t.newPassword + '</label>' +
        '<input type="password" id="new-password" class="form-input" autocomplete="new-password" />' +
      '</div>' +
      '<div class="form-row">' +
        '<label class="form-label">' + t.confirmPassword + '</label>' +
        '<input type="password" id="confirm-password" class="form-input" autocomplete="new-password" />' +
      '</div>' +
      '<button id="save-btn" class="btn">' + t.savePassword + '</button>';

    document.getElementById('save-btn').addEventListener('click', submitNewPassword);
  }

  function showError(msg) {
    const el = document.getElementById('recovery-error');
    if (el) el.innerHTML = '<div class="error-msg">⚠️ ' + msg + '</div>';
  }

  async function submitNewPassword() {
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const btn = document.getElementById('save-btn');

    if (newPassword.length < 6) { showError(t.passwordTooShort); return; }
    if (newPassword !== confirmPassword) { showError(t.passwordMismatch); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> ' + t.saving;

    try {
      const { error: updateError } = await sb.auth.updateUser({ password: newPassword });
      if (updateError) throw updateError;
      renderSuccess(t.recoverySuccessTitle, t.recoverySuccessMessage);
    } catch (err) {
      showError(t.genericError);
      btn.disabled = false;
      btn.textContent = t.savePassword;
    }
  }

  function renderSuccess(title, message) {
    resolved = true;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    body.innerHTML =
      checkIconHtml() +
      '<h1>' + title + '</h1>' +
      '<p>' + message + '</p>' +
      '<p class="hint">' + t.hintDesktop + '</p>' +
      (isMobile ? '<a id="open-app-btn" class="btn" href="bielaac://login-callback">' + t.openApp + '</a>' : '');

    if (isMobile) {
      window.location.href = 'bielaac://login-callback';
    }
  }

  function renderInvalidLink() {
    resolved = true;
    body.innerHTML = '<h1>' + t.recoveryTitle + '</h1><div class="error-msg">⚠️ ' + t.invalidLink + '</div>';
  }

  // ─── ROTEAMENTO VIA EVENTOS DE AUTH (funciona com PKCE e implicit) ────
  const flowHint = detectFlowTypeHint();

  sb.auth.onAuthStateChange((event, session) => {
    if (resolved) return;
    if (event === 'PASSWORD_RECOVERY') {
      renderRecoveryForm();
    } else if (event === 'SIGNED_IN' && flowHint !== 'recovery') {
      const copy = t.success[flowHint] || t.success.default;
      renderSuccess(copy.title, copy.message);
    }
  });

  // Se depois de alguns segundos nada foi resolvido (link inválido/expirado,
  // ou já usado antes), mostramos um erro em vez de deixar girando pra sempre.
  setTimeout(() => {
    if (!resolved) renderInvalidLink();
  }, 6000);
</script>
</body>
</html>
